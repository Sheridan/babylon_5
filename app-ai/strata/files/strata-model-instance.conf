# Strata server instance settings - the file systemd's strata@.service reads
# as EnvironmentFile=/etc/strata/instances.d/<id>/daemon.conf.
#
# This is the packaged default under /etc/strata/instances.d/. Copies are made
# per model instance, e.g. instances.d/llama-3.2-3b-instruct-q4_k_m/daemon.conf,
# by strata-download-model; edit the copy to adjust this instance.
#
# The file must be readable by the service user (root:strata 0640 recommended
# once it holds credentials); strata-rm-model and strata-download-model refuse
# to work with a world-readable copy that holds a token.

# Where the web API listens. The host keeps one canonical port (8080), and one
# port is held by at most one running instance: start a second instance only
# after giving it another STRATA_PORT here.
STRATA_HOST=127.0.0.1
STRATA_PORT=8080

# Optional: download token for gated models (https://huggingface.co/settings/tokens).
# Keep the file 0640 root:strata when you set it.
#HF_TOKEN=

# Optional: proxy for downloading models, e.g.
#HTTPS_PROXY=http://127.0.0.1:8118
